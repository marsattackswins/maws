name: Integration Tests

on:
  # Run on PRs that touch server code
  pull_request:
    branches:
      - master
    paths:
      - 'lib/server/**'
      - 'tests/integration/**'
      - '.github/workflows/integration-tests.yml'

  # Run nightly on master branch
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: 'false'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      status: ${{ steps.summary.outputs.status }}
      duration: ${{ steps.summary.outputs.duration }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      total: ${{ steps.summary.outputs.total }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Binance Testnet availability
        run: |
          echo "Checking Binance testnet connectivity..."
          curl -f https://testnet.binancefuture.com/fapi/v1/ping || exit 1

      - name: Run integration tests
        id: run-tests
        env:
          MAWS_BINANCE_API_KEY: ${{ secrets.TESTNET_API_KEY }}
          MAWS_BINANCE_API_SECRET: ${{ secrets.TESTNET_API_SECRET }}
          MAWS_TEST_VERBOSE: ${{ github.event.inputs.verbose || 'false' }}
        run: |
          START_TIME=$(date +%s)
          npm run test:integration -- --json --outputFile=test-results.json 2>&1 | tee test-output.log || true
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

          # Parse test results
          if [ -f test-results.json ]; then
            PASSED=$(jq '.success' test-results.json 2>/dev/null || echo "0")
            FAILED=$(jq '.numFailedTestSuites' test-results.json 2>/dev/null || echo "0")
            TOTAL=$(jq '.numTotalTestSuites' test-results.json 2>/dev/null || echo "0")
          else
            # Fallback: parse from output
            PASSED=$(grep -oP '\d+(?= passed)' test-output.log | tail -1 || echo "0")
            FAILED=$(grep -oP '\d+(?= failed)' test-output.log | tail -1 || echo "0")
            TOTAL=$(grep -oP '\d+(?= total)' test-output.log | tail -1 || echo "0")
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Generate summary
        id: summary
        if: always()
        run: |
          STATUS="${{ steps.run-tests.outcome == 'success' && 'pass' || 'fail' }}"
          DURATION="${{ steps.run-tests.outputs.duration || '0' }}"
          PASSED="${{ steps.run-tests.outputs.passed || '0' }}"
          FAILED="${{ steps.run-tests.outputs.failed || '0' }}"
          TOTAL="${{ steps.run-tests.outputs.total || '0' }}"

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Log summary as JSON line
          SUMMARY=$(cat <<EOF
          {"ts":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","event":"integration_test_run","status":"$STATUS","duration_sec":$DURATION,"suites":{"passed":$PASSED,"failed":$FAILED,"total":$TOTAL},"ref":"${{ github.ref }}","sha":"${{ github.sha }}","run_id":"${{ github.run_id }}"}
          EOF
          )
          echo "$SUMMARY"
          echo "$SUMMARY" >> integration-summary.jsonl

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            coverage/
            *.log
            test-results.json
            integration-summary.jsonl

      - name: Post webhook notification
        if: always() && env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          STATUS="${{ steps.summary.outputs.status }}"
          DURATION="${{ steps.summary.outputs.duration }}"
          PASSED="${{ steps.summary.outputs.passed }}"
          FAILED="${{ steps.summary.outputs.failed }}"
          TOTAL="${{ steps.summary.outputs.total }}"

          PAYLOAD=$(cat <<EOF
          {
            "status": "$STATUS",
            "duration_sec": $DURATION,
            "suites": {
              "passed": $PASSED,
              "failed": $FAILED,
              "total": $TOTAL
            },
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "triggered_by": "${{ github.event_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          )

          echo "Posting webhook notification..."
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" \
            --fail-with-body || echo "Webhook notification failed (non-blocking)"

      - name: Notify on failure (optional)
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Integration tests failed on master branch",
              "status": "${{ job.status }}"
            }

  # Validate workflow YAML as a dry-run step
  validate-workflow:
    runs-on: ubuntu-latest
    needs: integration
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate workflow YAML syntax
        run: |
          echo "Validating .github/workflows/integration-tests.yml..."
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/integration-tests.yml'))"
          echo "YAML syntax valid"

      - name: Check required triggers
        run: |
          echo "Checking workflow triggers..."
          grep -q "cron: '0 2 * * *'" .github/workflows/integration-tests.yml && echo "✓ Nightly cron schedule found"
          grep -q "workflow_dispatch:" .github/workflows/integration-tests.yml && echo "✓ Manual trigger found"
          grep -q "pull_request:" .github/workflows/integration-tests.yml && echo "✓ PR trigger found"
          echo "All required triggers present"
