# MAWS reverse proxy (nginx).
#
# Trust model: MAWS reads client IP from X-Forwarded-For ONLY when
# MAWS_TRUST_PROXY=true. That is safe only because this proxy is the sole
# ingress and strips any inbound forwarding headers first (proxy_set_header
# below overwrites whatever a client sent).
#
# Binance IP allowlisting: the host must egress from a FIXED public IP;
# restrict the API key to that IP in the Binance API-key settings.

upstream maws_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name terminal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name terminal.example.com;

    ssl_certificate     /etc/letsencrypt/live/terminal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terminal.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 64k;

    # SSE / streaming endpoints: disable buffering so events arrive live.
    location ~ ^/api/live/(events|stream-status) {
        proxy_pass http://maws_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # authoritative: replaces any inbound header
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://maws_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
